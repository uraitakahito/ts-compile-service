name: release

# tag (vX.Y.Z) を push すると、runtime image を ghcr.io に出す。
#
# 建てるのは linux/arm64 だけ —— 消費者は Apple Container (arm64)。runner も arm64 (ubuntu-24.04-arm、
# 公開 repo なら無料) なので QEMU は要らない。amd64 が要る人が出たら platforms に足す。
#
# package の visibility は初回だけ GitHub の UI で public にする (Apple Container が認証無しで引けるように)。

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/uraitakahito/ts-compile-service:${{ github.ref_name }}
