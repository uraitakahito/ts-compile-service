name: ci

# `pnpm run check` と同じ顔ぶれを、同じ並びで、1 つずつ (どれが落ちたかを GitHub の UI で読めるように)。
#
# smithy:check は Smithy CLI (JRE 同梱・約 90 MB) を .smithy-cli/ に落とす。actions/cache で版ごとに持つ。
# host-types:check は raw.githubusercontent.com へ出る。落ちたら、pin か写しのどちらかがずれている。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: .smithy-cli
          key: smithy-cli-${{ hashFiles('scripts/smithy.sh') }}

      - run: pnpm run audit
      - run: pnpm run smithy:check
      - run: pnpm run host-types:check
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test
      - run: pnpm run build

  # runtime image を毎 PR で建てて、起こして、叩く。push はしない (それは release.yaml)。
  # 「prod の image は CI が建てない」で、消した file の COPY が何 PR も生き残ったことがある —— それを防ぐ。
  # runner は amd64 なので image も amd64 (ここで見るのは COPY と起動だけ。配るのは arm64)。
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Containerfile -t ts-compile-service:ci .
      - run: docker run -d --name tcs -p 127.0.0.1:8080:8080 ts-compile-service:ci
      - name: healthz と compile が答える
        run: |
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/healthz | grep -q '"hostTypes"'
          # 型が通らない 1 本 → 422 (受け皿の型が image に入っていなければ TS7017 ではなく別の答えになる)
          src='const n: number = "x"; globalThis.__bh.report("x", { n });'
          sha=$(printf '%s' "$src" | sha256sum | cut -d' ' -f1)
          code=$(curl -s -o /tmp/body -w '%{http_code}' -H 'content-type: application/json' \
            -d "{\"scripts\":[{\"id\":\"x\",\"version\":1,\"phase\":\"behavior\",\"source\":$(printf '%s' "$src" | jq -Rs .),\"sha256\":\"$sha\",\"options\":{}}]}" \
            http://127.0.0.1:8080/compile)
          cat /tmp/body; echo
          test "$code" = 422 && grep -q TS2322 /tmp/body && ! grep -q TS7017 /tmp/body
          # 空の目録は 200 で、何もしない。台帳の `scriptIds: []` (何も走らせない) がここで落ちないように
          code=$(curl -s -o /tmp/empty -w '%{http_code}' -H 'content-type: application/json' \
            -d '{"scripts":[]}' http://127.0.0.1:8080/compile)
          cat /tmp/empty; echo
          test "$code" = 200 && grep -q '"scripts":\[\]' /tmp/empty && grep -q '"hostTypes"' /tmp/empty
      - if: always()
        run: docker logs tcs; docker rm -f tcs
